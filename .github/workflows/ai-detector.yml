name: Pi AI detector
on:
  pull_request:
    paths:
      - tools/ai-detector/**
      - .github/workflows/ai-detector.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/ai-detector/requirements.txt
      - run: bash -n tools/ai-detector/install.sh
      - run: bash -n tools/ai-detector/update.sh
      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          if [ "$(uname -m)" = x86_64 ]; then
            python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install --only-binary=:all: -r tools/ai-detector/requirements.txt httpx==0.28.1
      - name: API and real tiny-model regression tests
        run: python -m unittest discover -s tools/ai-detector -p 'test_*.py' -v
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          TOKENIZERS_PARALLELISM: 'false'
          USE_TF: '0'
          USE_TORCH: '1'
