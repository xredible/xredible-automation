name: Review and correct sermon subtitles
on:
  push:
    branches: [media]
    paths: ['.github/workflows/ec-subtitle-review.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: media}
      - name: Render proofread Hindi and English subtitles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core python3-pil
          bash elevating-christ/sermon-clips/2026-11-06-buddhi-vishwas/render-bilingual-v1.sh

# Final mobile legibility pass: larger Hindi and English captions.
