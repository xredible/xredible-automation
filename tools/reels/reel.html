<!doctype html><html><head><meta charset="utf-8"><style>
/* Nestoodle explainer reel, v2 (17 Nov 2026).
   Every scene owns its photo: no photo is shown twice (render.mjs refuses a reel that repeats one).
   Item scene: blurred copy of the photo fills the screen, the sharp photo sits full width in the middle with a
   slow camera move, a step pill + title on top and 3-word captions below. The hook shows only its own photo
   (or a type-only title card when none is given). Text stays out of the top and bottom 250 px used by app UI.
   Spec contract: scenes[] of {kind: hook|item|cta, headline, title, text, image?, dur}. */
@font-face{font-family:Baloo;src:url(assets/Baloo2-ExtraBold.ttf)}@font-face{font-family:Karla;src:url(assets/Karla-Bold.ttf)}
:root{--bg:#121a24;--line:#2a3646;--coral:#ef7a4f;--coral2:#f7a07c;--teal:#3fb5a0;--cream:#fff4e6;--dim:#8a97a8}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--cream)}
#stage{width:1080px;height:1920px;position:relative;font-family:Karla,sans-serif;overflow:hidden;background:var(--bg)}
.glow{position:absolute;left:-200px;right:-200px;top:-520px;height:1200px;background:radial-gradient(closest-side,#ef7a4f55,#ef7a4f18 55%,transparent)}
.scene{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(38px) saturate(1.15) brightness(.55)}
.shade{position:absolute;inset:0;background:linear-gradient(#0d131bcc 0,#0d131b33 22%,#0d131b11 50%,#0d131b55 70%,#0d131bdd 100%)}
.photo{position:absolute;left:0;right:0;top:560px;height:720px;overflow:hidden;box-shadow:0 30px 80px #000a}
.photo .pic{position:absolute;inset:0;background-size:cover;background-position:center;will-change:transform}
.pill{display:inline-block;padding:14px 30px;border-radius:999px;background:var(--coral);color:#fff;font:34px Karla;letter-spacing:4px}
.top{position:absolute;top:290px;left:70px;right:70px;text-align:center}
.top .t{margin-top:22px;font:84px/1.02 Baloo;color:#fff;text-shadow:0 6px 24px #000c}
.hook .top{top:330px}.hook .t{font-size:112px}.hook .t em{font-style:normal;color:var(--coral)}
.hook.noimg .top{top:560px}
.caption{position:absolute;bottom:330px;left:60px;right:60px;text-align:center;font:76px/1.12 Baloo;color:#fff;text-shadow:0 6px 18px #000c}
.caption span{opacity:.4}.caption span.said{opacity:1}.caption span.cur{opacity:1;color:var(--coral)}
.brand{position:absolute;bottom:270px;width:100%;text-align:center;font:30px Karla;letter-spacing:5px;color:#ffffffaa}
.steps{position:absolute;top:70px;left:50px;right:50px;display:flex;gap:12px;z-index:5}
.steps .seg{flex:1;height:8px;border-radius:8px;background:#ffffff33;overflow:hidden}.steps .fill{height:100%;width:0;background:var(--coral)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
/* CTA */
.cta-title{position:absolute;top:300px;left:60px;right:60px;text-align:center;font:44px Karla;letter-spacing:6px;color:var(--coral)}
.list{position:absolute;left:90px;right:90px;top:400px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:22px;padding:18px 26px;border-radius:24px;background:#1b2532;border:2px solid var(--line);font:36px Karla;color:var(--cream)}
.row .num{font:40px Baloo;color:var(--coral);width:60px}
.row .chk{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--teal);flex:none;position:relative}
.row .chk:after{content:"";position:absolute;left:15px;top:7px;width:12px;height:22px;border:solid #fff;border-width:0 6px 6px 0;transform:rotate(45deg)}
.cta-pill{position:absolute;left:110px;right:110px;top:1160px;padding:34px;border-radius:40px;background:linear-gradient(90deg,var(--coral),var(--coral2));color:#fff;text-align:center;font:54px/1.15 Baloo;box-shadow:0 24px 60px #ef7a4f55}
.logo{position:absolute;top:1380px;left:450px;width:180px;height:180px;border-radius:50%;background:var(--cream);padding:24px}
</style></head><body><div id="stage"><div class="glow"></div></div><script>
// All generated copy is assigned via textContent. No LLM text or URL is interpolated into HTML.
let scenes=[],starts=[],built=false,total=0,items=[],segs=[];
const stage=document.getElementById('stage');
const add=(parent,tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;parent.appendChild(el);return el};
const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>1-Math.pow(1-clamp(x),3);const pop=x=>{x=clamp(x);return x<1?1-Math.pow(1-x,3)*Math.cos(x*4.2):1};
const bg=(el,src)=>{el.style.backgroundImage=`url(${JSON.stringify(src)})`};
// Four camera moves, chosen by scene position so neighbours never move the same way.
const MOVES=[p=>`scale(${1.04+.12*p})`,p=>`scale(1.14) translateX(${(-.5+p)*-60}px)`,p=>`scale(${1.16-.1*p})`,p=>`scale(1.14) translateX(${(-.5+p)*60}px)`];
function build(){const spec=window.SPEC;items=spec.scenes.filter(s=>s.kind==='item');
  const steps=add(stage,'div','steps');items.forEach(()=>{const seg=add(steps,'div','seg');add(seg,'div','fill');segs.push(seg)});
  let itemNo=0;for(const [i,s] of spec.scenes.entries()){starts.push(total);total+=s.dur;const el=add(stage,'div',`scene ${s.kind}`);s._i=i;
    if(s.kind==='hook'){if(s.image){bg(add(el,'div','bg'),s.image);const ph=add(el,'div','photo');bg(add(ph,'div','pic'),s.image);}else el.classList.add('noimg');add(el,'div','shade');
      const top=add(el,'div','top');add(top,'div','pill',String(spec.kicker||'KIDS ACTIVITIES').toUpperCase());const h=add(top,'div','t');const w=String(s.headline||spec.title||'').split(/\s+/).filter(Boolean);w.forEach((x,k)=>{add(h,k>=w.length-2?'em':'span','',x);h.appendChild(document.createTextNode(' '))});}
    else if(s.kind==='item'){const k=itemNo++;s._k=k;bg(add(el,'div','bg'),s.image);const ph=add(el,'div','photo');bg(add(ph,'div','pic'),s.image);add(el,'div','shade');
      const top=add(el,'div','top');add(top,'div','pill',`STEP ${k+1} OF ${items.length}`);add(top,'div','t',s.title||s.headline||'');}
    else{add(el,'div','cta-title','THE FULL LIST');const box=add(el,'div','list');items.forEach((it,k)=>{const r=add(box,'div','row');add(r,'span','num',String(k+1).padStart(2,'0'));add(r,'span','',it.title||it.headline||'');add(r,'span','chk')});
      add(el,'div','cta-pill',s.headline||'Full guide + free printable at nestoodle.com');const lg=add(el,'img','logo');lg.src=spec.logo;}
    add(el,'div','caption');add(el,'div','brand','nestoodle.com');scenes.push(el);}
  add(stage,'div','flash');built=true;}
function caption(el,s,time){const cap=el.querySelector('.caption');if(s.caption===false){cap.textContent='';return}
  const words=String(s.text||'').split(/\s+/).filter(Boolean);if(!words.length){cap.textContent='';return}
  const speak=Math.max(.6,s.dur-.6),len=words.map(w=>w.length+2),sum=len.reduce((a,b)=>a+b,0);let acc=0,cur=words.length-1;const tt=Math.max(0,time-.1)/speak*sum;
  for(let k=0;k<words.length;k++){acc+=len[k];if(tt<acc){cur=k;break}}const start=Math.floor(cur/3)*3;cap.textContent='';
  words.slice(start,start+3).forEach((w,k)=>{const idx=start+k;add(cap,'span',idx<cur?'said':idx===cur?'cur':'',w);cap.appendChild(document.createTextNode(' '))});}
window.renderAt=t=>{if(!built)build();const spec=window.SPEC;let active=0;
  spec.scenes.forEach((s,i)=>{const el=scenes[i],time=t-starts[i],visible=time>=0&&time<s.dur;el.style.display=visible?'block':'none';if(!visible)return;active=i;const p=time/s.dur;
    // Cut in: the new scene wipes in from the right over 0.3 s.
    el.style.clipPath=i===0?'none':`inset(0 0 0 ${(1-ease(time/.3))*100}%)`;
    const pic=el.querySelector('.photo .pic');if(pic)pic.style.transform=MOVES[i%4](p);
    const b=el.querySelector('.bg');if(b)b.style.transform=`scale(${1.1+.06*p})`;
    const top=el.querySelector('.top');if(top){top.style.opacity=ease((time-.1)/.3);top.style.transform=`translateY(${(1-pop((time-.1)/.5))*-50}px)`;}
    const ph=el.querySelector('.photo');if(ph){const q=ease((time-.05)/.4);ph.style.transform=`scale(${.94+.06*q})`;}
    if(s.kind==='hook'){el.querySelectorAll('.t span,.t em').forEach((w,k)=>{const q=pop((time-.15-k*.09)/.4);w.style.opacity=clamp((time-.15-k*.09)/.2);w.style.display='inline-block';w.style.transform=`scale(${.6+.4*q})`})}
    if(s.kind==='cta'){el.querySelectorAll('.row').forEach((r,k)=>{const d=clamp((time-.2-k*.15)/.3);r.style.opacity=d;r.style.transform=`translateX(${(1-ease(d))*-40}px)`});const n=items.length*.15;const pill=el.querySelector('.cta-pill');pill.style.opacity=clamp((time-.4-n)/.25);pill.style.transform=`scale(${.7+.3*pop((time-.4-n)/.5)})`;el.querySelector('.logo').style.transform=`scale(${pop((time-.7-n)/.5)})`;}
    caption(el,s,time);});
  const cur=spec.scenes[active],k=cur.kind==='item'?cur._k:cur.kind==='cta'?items.length:-1,tIn=t-starts[active];
  segs.forEach((seg,j)=>{seg.querySelector('.fill').style.width=((j<k?1:j===k?clamp(tIn/cur.dur):0)*100)+'%'});
  stage.querySelector('.steps').style.opacity=cur.kind==='hook'?0:1;
  stage.querySelector('.flash').style.opacity=active>0&&tIn<.12?(.12-tIn)/.12*.25:0;};
</script></body></html>
