<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Baloo;src:url(assets/Baloo2-ExtraBold.ttf)}@font-face{font-family:Karla;src:url(assets/Karla-Bold.ttf)}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#faf3e7;color:#332b22}#stage{width:1080px;height:1920px;position:relative;font-family:Karla,sans-serif}.scene{position:absolute;inset:0;overflow:hidden}.photo{position:absolute;inset:-60px;background-size:cover;background-position:center}.shade{position:absolute;inset:0;background:linear-gradient(#0005,#0001 50%,#0009)}.title{position:absolute;left:60px;right:60px;top:340px;background:#fffcf6;padding:32px 40px;border-radius:36px;border-bottom:12px solid #3e8fa6;font:78px/1.05 Baloo;color:#332b22}.hook .title{top:600px;background:#e0653cf2;color:white;text-align:center;font-size:94px}.number{position:absolute;top:175px;left:60px;width:130px;height:130px;border-radius:50%;background:#e0653c;color:white;text-align:center;font:90px/140px Baloo}.caption{position:absolute;bottom:420px;left:70px;right:70px;text-align:center;color:white;font:74px/1.1 Baloo;-webkit-text-stroke:3px #000b;paint-order:stroke fill;text-shadow:0 5px 12px #0008}.brand{position:absolute;top:70px;right:55px;display:flex;align-items:center;gap:16px;border-radius:50px;padding:10px 25px 10px 12px;background:#fffcf6ed;font:42px Baloo}.brand img{width:65px;height:65px}.cta{background:#e0653c}.cta .title{top:760px;font-size:86px;text-align:center;color:#e0653c}.cta-logo{position:absolute;top:350px;left:370px;width:340px;height:340px;background:#fffcf6;border-radius:50%;padding:40px}.cta .caption{bottom:380px;font-size:52px}.progress{position:absolute;top:0;left:0;height:12px;background:#3e8fa6}.footer{position:absolute;bottom:230px;width:100%;text-align:center;color:#fff9;font-size:46px}
</style></head><body><div id="stage"></div><script>
// All generated copy is assigned via textContent. No LLM text or URL is interpolated into HTML.
let scenes=[],starts=[],built=false,total=0;
const stage=document.getElementById('stage');
const add=(parent,tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;parent.appendChild(el);return el};
const ease=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
function build(){const spec=window.SPEC;for(const [i,s] of spec.scenes.entries()){starts.push(total);total+=s.dur;const el=add(stage,'div',`scene ${s.kind}`);if(s.kind!=='cta'){const photo=add(el,'div','photo');photo.style.backgroundImage=`url(${JSON.stringify(s.image||'')})`;add(el,'div','shade');if(s.kind==='item')add(el,'div','number',String(s.n||i));}else{const logo=add(el,'img','cta-logo');logo.src=spec.logo;add(el,'div','footer','nestoodle.com');}add(el,'div','title',s.kind==='hook'?s.headline:s.kind==='cta'?(s.headline||'Full guide at nestoodle.com'):s.title);add(el,'div','caption');const brand=add(el,'div','brand');add(brand,'img').src=spec.logo;add(brand,'span','', 'nestoodle');scenes.push(el);}add(stage,'div','progress');built=true;}
window.renderAt=t=>{if(!built)build();window.SPEC.scenes.forEach((s,i)=>{const el=scenes[i],time=t-starts[i],visible=time>=0&&time<s.dur;el.style.display=visible?'block':'none';if(!visible)return;const title=el.querySelector('.title');title.style.transform=`translateY(${(1-ease(time/.4))*-60}px)`;const photo=el.querySelector('.photo');if(photo)photo.style.transform=`scale(${1.02+.1*time/s.dur}) translateX(${(i%2?-1:1)*16*time/s.dur}px)`;const words=String(s.text||'').split(/\s+/).filter(Boolean);const group=Math.min(Math.ceil(words.length/3)-1,Math.floor(Math.max(0,time-.15)/Math.max(.3,s.dur-.5)*Math.ceil(words.length/3)));el.querySelector('.caption').textContent=s.caption===false?'':words.slice(group*3,group*3+3).join(' ');});stage.querySelector('.progress').style.width=`${1080*Math.min(1,t/total)}px`;};
</script></body></html>
