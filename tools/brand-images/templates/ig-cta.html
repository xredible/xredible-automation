<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>{{CSS}}
main{background:var(--green);color:var(--cream)}.content{position:absolute;inset:170px 80px 170px;display:flex;flex-direction:column;align-items:center;text-align:center}.save{font-size:110px;max-height:350px}.rule{height:7px;width:100px;background:var(--butter);margin:52px 0}.action{font-size:52px;line-height:1.2;max-height:450px}.content .brand{position:absolute;bottom:0;color:var(--cream)}.content .brand img{width:100px;height:100px}.keyword{display:block;color:var(--butter);font-size:78px;margin:20px 0;font-family:Baloo;padding-bottom:.32em}</style></head><body><main><section class="content"><h1 class="save" data-fit data-lines="3" data-max="110" data-overlay>Save this<br>for later</h1><div class="rule"></div><p class="action" data-overlay>Comment <span class="keyword" data-field="keyword" data-fit data-lines="1" data-max="78"></span><span style="display:block" data-field="cta" data-fit data-lines="3" data-max="48"></span></p><div class="brand" data-overlay><img data-logo alt="Nestoodle"><span>nestoodle.com</span></div></section></main></body></html>
